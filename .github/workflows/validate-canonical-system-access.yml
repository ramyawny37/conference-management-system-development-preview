name: Validate canonical system access
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'js/supabase/system-access-service.js'
      - 'tests/system-access-foundation.test.js'
      - 'js/sync/user-management-ui.js'
      - 'js/sync/user-management-read-service.js'
      - 'js/sync/platform-administration-ui.js'
      - 'js/sync/device-authorization-administration-ui.js'
      - 'tests/user-management-account-actions.test.js'
      - 'tests/user-management-device-ui.test.js'
      - 'tests/platform-administration-roles-route-lifecycle.test.js'
      - '.github/workflows/validate-canonical-system-access.yml'
jobs:
  validate-system-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Check canonical access service syntax
        run: node --check js/supabase/system-access-service.js
      - name: Test canonical account access and offline fail-closed behavior
        run: node tests/system-access-foundation.test.js
      - name: Check administration UI syntax
        run: |
          node --check js/sync/user-management-ui.js
          node --check js/sync/user-management-read-service.js
          node --check js/sync/platform-administration-ui.js
          node --check js/sync/device-authorization-administration-ui.js
      - name: Test administration navigation and account/device controls
        run: |
          node tests/user-management-account-actions.test.js
          node tests/user-management-device-ui.test.js
          node --test tests/platform-administration-roles-route-lifecycle.test.js
