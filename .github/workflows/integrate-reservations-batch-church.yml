name: Integrate verified Reservations batch church artifact
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private source access and immutable artifact
        env:
          GH_TOKEN: ${{ secrets.RESERVATIONS_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing RESERVATIONS_SOURCE_TOKEN"; exit 1; }
          source_repo=ramyawny37/reservation-management-system
          actual_sha=$(gh api "repos/$source_repo/actions/runs/38574263267" --jq .head_sha)
          test "$actual_sha" = "0f205a3508a8ac4eb66ed21684ff669a5e305a32"
          gh api "repos/$source_repo/actions/artifacts/11898901876/zip" > "$RUNNER_TEMP/reservations.zip"
          unzip -t "$RUNNER_TEMP/reservations.zip"
      - name: Integrate, validate and push develop only
        run: |
          set -euo pipefail
          node tools/integrate-reservations-artifact.cjs "$RUNNER_TEMP/reservations.zip"
          node --check modules/reservations/reservations-module.js
          git diff --check
          git add modules/reservations/reservations-module.js modules/reservations/reservations-module.css index.html service-worker.js
          git diff --cached --quiet && { echo "::error::No integration changes"; exit 1; }
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "fix(reservations): integrate canonical batch church selection"
          git push origin HEAD:develop
