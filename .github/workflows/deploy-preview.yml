name: Deploy development preview

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: development-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout develop source
        id: source
        uses: actions/checkout@v4
        with:
          repository: ramyawny37/conference-management-system-v1
          ref: develop
          path: site

      - name: Mirror develop source revision for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C site push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/development-preview-source

      - name: Configure Development Supabase in preview artifact
        env:
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const url = process.env.SUPABASE_URL_DEV || '';
          const key = process.env.SUPABASE_ANON_KEY_DEV || '';

          if (!url || !key) {
            throw new Error('Development Supabase configuration is missing');
          }

          if (!url.includes('gppwltrifgfxrkzvvxoe.supabase.co')) {
            throw new Error('Refusing non-Development Supabase target');
          }

          const content =
            "(function(global){\n" +
            "  'use strict';\n\n" +
            "  global.SUPABASE_RUNTIME_CONFIG=Object.freeze({\n" +
            "    url:" + JSON.stringify(url) + ",\n" +
            "    publishableKey:" + JSON.stringify(key) + "\n" +
            "  });\n" +
            "})(window);\n";

          fs.writeFileSync(
            'site/js/supabase/public-config.js',
            content,
            'utf8'
          );
          NODE

      - name: Verify Production Supabase is absent from runtime
        run: |
          if grep -R "mpezfbvcdfxpgflehuot" site \
            --exclude-dir=tests \
            --exclude-dir=.git; then
            echo "Production Supabase reference found in preview runtime"
            exit 1
          fi

      - name: Verify Development Supabase target
        run: |
          grep -q "gppwltrifgfxrkzvvxoe.supabase.co" site/js/supabase/public-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy preview
        id: deployment
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          BUILD_VERSION: ${{ steps.source.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          async function request(url, options = {}) {
            const response = await fetch(url, options);
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${url} failed (${response.status}): ${body}`);
            }
            return body ? JSON.parse(body) : {};
          }

          async function main() {
            const artifactId = Number(process.env.ARTIFACT_ID);
            const buildVersion = process.env.BUILD_VERSION || '';
            const repository = process.env.REPOSITORY || '';
            const githubToken = process.env.GH_TOKEN || '';
            const oidcUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL || '';
            const oidcRequestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN || '';

            if (!artifactId || !/^[0-9a-f]{40}$/.test(buildVersion)) {
              throw new Error('Artifact ID or develop source commit is invalid');
            }
            if (!repository || !githubToken || !oidcUrl || !oidcRequestToken) {
              throw new Error('Pages deployment credentials are unavailable');
            }

            const oidc = await request(oidcUrl, {
              headers: { Authorization: `bearer ${oidcRequestToken}` }
            });
            const deployment = await request(`https://api.github.com/repos/${repository}/pages/deployments`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${githubToken}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28'
              },
              body: JSON.stringify({
                artifact_id: artifactId,
                pages_build_version: buildVersion,
                oidc_token: oidc.value
              })
            });

            const deploymentId = deployment.id || String(deployment.status_url || '').split('/').pop();
            if (!deploymentId) throw new Error('Pages deployment ID is unavailable');
            console.log(`Created deployment for ${buildVersion}, ID: ${deploymentId}`);

            const statusUrl = `https://api.github.com/repos/${repository}/pages/deployments/${deploymentId}`;
            for (let attempt = 0; attempt < 120; attempt += 1) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const status = await request(statusUrl, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${githubToken}`,
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
              if (status.status === 'succeed') {
                console.log('Reported success!');
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `page_url=${deployment.page_url || ''}\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${deploymentId}\n`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${buildVersion}\n`);
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status.status)) {
                throw new Error(`Pages deployment failed with status: ${status.status}`);
              }
              console.log(`Current status: ${status.status}`);
            }
            throw new Error('Pages deployment timed out');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
