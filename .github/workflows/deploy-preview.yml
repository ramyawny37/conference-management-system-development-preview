name: Deploy development preview

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: development-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Platform Development source
        uses: actions/checkout@v4
        with:
          repository: ramyawny37/conference-management-system-v1
          ref: develop
          path: source/platform
          fetch-depth: 1

      - name: Capture source provenance
        id: source_meta
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_SHA="$(git -C source/platform rev-parse HEAD)"
          JS_SHA="$(sha256sum source/platform/modules/reservations/reservations-module.js | awk '{print $1}')"
          CSS_SHA="$(sha256sum source/platform/modules/reservations/reservations-module.css | awk '{print $1}')"
          echo "platform_sha=$PLATFORM_SHA" >> "$GITHUB_OUTPUT"
          echo "reservations_js_sha256=$JS_SHA" >> "$GITHUB_OUTPUT"
          echo "reservations_css_sha256=$CSS_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Development source contracts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix source/platform run check
          node --check source/platform/js/storage/environment-namespace.js
          node --check source/platform/service-worker.js
          node source/platform/tests/browser-storage-isolation.test.js
          test -f source/platform/modules/reservations/reservations-module.js
          test -f source/platform/modules/reservations/reservations-module.css

      - name: Prepare isolated preview artifact
        shell: bash
        env:
          PLATFORM_SOURCE_SHA: ${{ steps.source_meta.outputs.platform_sha }}
          RESERVATIONS_JS_SHA256: ${{ steps.source_meta.outputs.reservations_js_sha256 }}
          RESERVATIONS_CSS_SHA256: ${{ steps.source_meta.outputs.reservations_css_sha256 }}
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          rsync -a source/platform/ site/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.audit/' \
            --exclude='/docs/' \
            --exclude='/node_modules/' \
            --exclude='/supabase/' \
            --exclude='/tests/' \
            --exclude='/tools/' \
            --exclude='/package.json' \
            --exclude='/package-lock.json'
          node <<'NODE'
          const fs = require('fs');
          const sources = {
            platform: {
              repository: 'ramyawny37/conference-management-system-v1',
              ref: 'develop',
              sha: process.env.PLATFORM_SOURCE_SHA
            },
            reservations: {
              delivery: 'embedded-in-platform',
              javascript_sha256: process.env.RESERVATIONS_JS_SHA256,
              css_sha256: process.env.RESERVATIONS_CSS_SHA256
            }
          };
          if (!/^[0-9a-f]{40}$/.test(sources.platform.sha || '')) throw new Error('Platform source SHA is invalid');
          if (!/^[0-9a-f]{64}$/.test(sources.reservations.javascript_sha256 || '')) throw new Error('Reservations JS SHA-256 is invalid');
          if (!/^[0-9a-f]{64}$/.test(sources.reservations.css_sha256 || '')) throw new Error('Reservations CSS SHA-256 is invalid');
          fs.writeFileSync('site/development-preview-sources.json', JSON.stringify(sources, null, 2) + '\n');
          NODE

      - name: Generate Development Supabase public config
        env:
          SUPABASE_URL_DEV: ${{ secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY_DEV: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expectedRef = 'gppwltrifgfxrkzvvxoe';
          const productionRef = 'mpezfbvcdfxpgflehuot';
          const expectedUrl = `https://${expectedRef}.supabase.co`;
          const url = String(process.env.SUPABASE_URL_DEV || '').replace(/\/$/, '');
          const key = String(process.env.SUPABASE_ANON_KEY_DEV || '');
          if (url !== expectedUrl) throw new Error('Preview Supabase project ref is not the approved Development ref');
          if (!key || key.includes(productionRef)) throw new Error('Preview Supabase publishable key is missing or rejected');
          if (key.startsWith('sb_secret_')) throw new Error('Preview Supabase key must not be a secret key');
          const parts = key.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            if (payload.role === 'service_role') throw new Error('Preview Supabase key must not be service_role');
          }
          const content = `(function(global){\n  'use strict';\n  global.SUPABASE_RUNTIME_CONFIG=Object.freeze({url:${JSON.stringify(url)},publishableKey:${JSON.stringify(key)}});\n})(window);\n`;
          fs.writeFileSync('site/js/supabase/public-config.js', content, 'utf8');
          NODE

      - name: Fail-closed preview artifact guard
        shell: bash
        env:
          RESERVATIONS_JS_SHA256: ${{ steps.source_meta.outputs.reservations_js_sha256 }}
          RESERVATIONS_CSS_SHA256: ${{ steps.source_meta.outputs.reservations_css_sha256 }}
        run: |
          set -euo pipefail
          if grep -R "mpezfbvcdfxpgflehuot" site; then
            echo "Production Supabase reference found in Preview artifact"
            exit 1
          fi
          grep -Fq "https://gppwltrifgfxrkzvvxoe.supabase.co" site/js/supabase/public-config.js
          grep -Fq "DEVELOPMENT_PROJECT_REF = 'gppwltrifgfxrkzvvxoe'" site/service-worker.js
          grep -Fq "DEVELOPMENT_PROJECT_REF='gppwltrifgfxrkzvvxoe'" site/js/storage/environment-namespace.js
          echo "$RESERVATIONS_JS_SHA256  site/modules/reservations/reservations-module.js" | sha256sum --check --strict
          echo "$RESERVATIONS_CSS_SHA256  site/modules/reservations/reservations-module.css" | sha256sum --check --strict
          grep -Fq 'class="platform-global-nav-item" data-platform-module="reservations"' site/index.html
          grep -Fq 'id="reservationsWorkspace"' site/index.html
          if grep -E "createClient\(|platform-device-session|supabase\.co" site/modules/reservations/reservations-module.js; then
            echo "Standalone Reservations auth/session configuration found in Preview artifact"
            exit 1
          fi
          node --check site/js/supabase/public-config.js
          node --check site/js/storage/environment-namespace.js
          node --check site/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
