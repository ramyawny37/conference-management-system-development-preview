name: Validate Reservations integration on develop
on:
  push:
    branches: [develop]
    paths:
      - 'tools/integrate-reservations-artifact.cjs'
      - '.github/workflows/validate-reservations-integration.yml'
      - 'modules/reservations/reservations-module.js'
      - 'modules/reservations/reservations-module.css'
      - 'index.html'
      - 'service-worker.js'
      - 'js/supabase/device-enrollment.js'
      - 'js/supabase/device-session.js'
      - 'tests/**'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integration script syntax
        run: node --check tools/integrate-reservations-artifact.cjs
      - name: Validate source boundary and cache references
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const tool = fs.readFileSync('tools/integrate-reservations-artifact.cjs', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const sw = fs.readFileSync('service-worker.js', 'utf8');
          for (const name of ['reservations-module.js', 'reservations-module.css']) {
            if (!tool.includes(name)) throw Error('Integrator missing ' + name);
            if (!index.includes('modules/reservations/' + name)) throw Error('HTML missing ' + name);
            if (!sw.includes('modules/reservations/' + name)) throw Error('SW missing ' + name);
          }
          if (!tool.includes("branch !== 'develop'")) throw Error('Missing develop guard');
          if (!tool.includes("crypto.createHash('sha256')")) throw Error('Missing checksum guard');
          console.log('Source boundary and references: PASS');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Conference Development platform regression tests
        run: node --test $(find tests -maxdepth 1 -name 'platform-*.test.js' ! -name 'platform-promotion-readiness.test.js' -print | sort)
      - name: Production promotion readiness (diagnostic only; never a Development acceptance gate)
        continue-on-error: true
        run: node --test tests/platform-promotion-readiness.test.js
      - name: Development preview validation
        if: always()
        run: npm run check:development-preview
