name: Reservations reconciliation regression

on:
  push:
    branches:
      - release/reservations-main-reconciliation

permissions:
  contents: write

jobs:
  regression:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reservations-main-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align release PWA shell revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=": 'production-3-4-0-item-unit-add-ui-v1';"
          new=": 'production-3-4-0-reservations-reconciliation-v1';"
          if s.count(old)!=1:
              raise SystemExit(f'expected one old production shell revision, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Materialize focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          develop_tests=(
            tests/platform-module-contract.test.js
            tests/platform-module-routing-reconciliation.test.js
            tests/platform-shell-responsive-contract.test.js
            tests/platform-module-permission-administration-multimodule.test.js
            tests/module-permission-catalog-arabic-labels.test.js
            tests/platform-private-recovery-rls-hardening.test.js
            tests/platform-reservations-conference-lifecycle.test.js
            tests/platform-reservations-event-booking-realignment.test.js
            tests/reservations-conference-scope-reconciliation.test.js
            tests/reservations-dispatch-contract.test.js
            tests/reservations-legacy-organization-scope-retirement.test.js
            tests/reservations-lifecycle.test.js
            tests/reservations-overlap-protection.test.js
            tests/reservations-permission-contract.test.js
            tests/reservations-platform-tenant-boundary.test.js
            tests/reservations-report-booking-pagination.test.js
            tests/reservations-schema-contract.test.js
            tests/reservations-scope-partition-integrity.test.js
            tests/reservations-scope-resolvers-contract.test.js
            tests/reservations-standalone-create-idempotency.test.js
          )
          for f in "${develop_tests[@]}"; do
            git show origin/develop:"$f" > "$f"
          done
          git show origin/main:tests/pwa-deterministic-update.test.js > tests/pwa-deterministic-update.test.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/pwa-deterministic-update.test.js')
          s=p.read_text()
          replacements={
            "const productionCacheRevision='production-3-4-0-item-unit-add-ui-v1';":
              "const productionCacheRevision='production-3-4-0-reservations-reconciliation-v1';",
            "const platformShellScriptRevision='production-platform-owner-administration-context-v1';":
              "const platformShellScriptRevision='platform-module-entry-gate-v1';",
            "[['js/platform-integration.js',startupRevision],\n ['js/supabase/device-session.js',startupTransportRevision]]":
              "[['js/platform-integration.js','module-entry-access-gate-v1'],\n ['js/supabase/device-session.js',startupTransportRevision]]"
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'expected one candidate PWA baseline token, found {s.count(old)}: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Run focused shell and Reservations regression
        shell: bash
        run: |
          node --test \
            tests/platform-module-entry-access-gate.test.js \
            tests/platform-module-contract.test.js \
            tests/platform-module-routing-reconciliation.test.js \
            tests/platform-shell-responsive-contract.test.js \
            tests/platform-module-permission-administration-multimodule.test.js \
            tests/module-permission-catalog-arabic-labels.test.js \
            tests/platform-private-recovery-rls-hardening.test.js \
            tests/pwa-deterministic-update.test.js \
            tests/platform-reservations-conference-lifecycle.test.js \
            tests/platform-reservations-event-booking-realignment.test.js \
            tests/reservations-conference-scope-reconciliation.test.js \
            tests/reservations-dispatch-contract.test.js \
            tests/reservations-legacy-organization-scope-retirement.test.js \
            tests/reservations-lifecycle.test.js \
            tests/reservations-overlap-protection.test.js \
            tests/reservations-permission-contract.test.js \
            tests/reservations-platform-tenant-boundary.test.js \
            tests/reservations-report-booking-pagination.test.js \
            tests/reservations-schema-contract.test.js \
            tests/reservations-scope-partition-integrity.test.js \
            tests/reservations-scope-resolvers-contract.test.js \
            tests/reservations-standalone-create-idempotency.test.js
      - name: Commit PWA alignment and remove one-time workflow
        shell: bash
        run: |
          git diff -- index.html > /tmp/index.patch
          git reset --hard HEAD
          git clean -fd tests
          git apply /tmp/index.patch
          rm .github/workflows/reservations-reconciliation-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/reservations-reconciliation-regression.yml
          git commit -m "fix(release): align reservations PWA shell revision"
          git push origin HEAD:release/reservations-main-reconciliation
