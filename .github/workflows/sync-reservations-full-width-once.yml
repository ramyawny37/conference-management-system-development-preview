name: Sync Reservations Full Width Once

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/sync-reservations-full-width-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download verified Reservations artifact
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9984-81f4-ad86-c764b81909db/raw?se=2026-09-14T20%3A03%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=b371e91a-fcdb-514a-9b45-733ca95d82c8&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T07%3A43%3A33Z&ske=2026-09-15T07%3A43%3A33Z&sks=b&skv=2026-02-06&sig=hcQkfjgkbsP2qGAEL3T4NbvoQEIhpE0vl56ofOi7jxM%3D' -o /tmp/reservations.zip
          echo 'f150bb11321ca4b48043b94e701ff5167af615008c9922bc05e07d3d039aa2ae  /tmp/reservations.zip' | sha256sum -c -
          rm -rf /tmp/reservations-artifact
          mkdir -p /tmp/reservations-artifact
          unzip -q /tmp/reservations.zip -d /tmp/reservations-artifact
          test -f /tmp/reservations-artifact/reservations-module.js
          test -f /tmp/reservations-artifact/reservations-module.css

      - name: Sync bundle and revision markers
        run: |
          cp /tmp/reservations-artifact/reservations-module.js modules/reservations/reservations-module.js
          cp /tmp/reservations-artifact/reservations-module.css modules/reservations/reservations-module.css
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('index.html'),
              Path('service-worker.js'),
              Path('tests/platform-module-contract.test.js'),
              Path('tests/platform-module-entry-access-gate.test.js'),
          ]
          for path in files:
              text = path.read_text()
              if 'mountable-bundle-v10' not in text:
                  raise SystemExit(f'missing v10 marker in {path}')
              path.write_text(text.replace('mountable-bundle-v10', 'mountable-bundle-v11'))
          PY

      - name: Verify bundle identity and integration contract
        run: |
          git hash-object modules/reservations/reservations-module.js | grep -Fx 'd4f5a2c2d31f582af4a5a1dfe064a0dcf9a7075f'
          git hash-object modules/reservations/reservations-module.css | grep -Fx '8ec4486553ff61d83edc7a655e0c7baa0fbf5849'
          grep -F 'mountable-bundle-v11' index.html
          grep -F 'mountable-bundle-v11' service-worker.js
          node --test tests/platform-module-contract.test.js tests/platform-module-entry-access-gate.test.js tests/reservations-reconciliation-rejected-architecture-guard.test.js

      - name: Commit synchronized artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js modules/reservations/reservations-module.js modules/reservations/reservations-module.css tests/platform-module-contract.test.js tests/platform-module-entry-access-gate.test.js
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'chore(reservations): sync full-width platform bundle'
          git push origin HEAD:develop
