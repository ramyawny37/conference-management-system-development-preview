name: Update Platform Preview Pin Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-reservations-preview-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update approved Platform source pin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy-preview.yml')
          s = p.read_text()
          old = '7a4734548638b89dacf2767ec28f06bdbc68c460'
          new = 'f59b0c0edeff7868ca9311ea80683e9b07a3da1c'
          if old not in s:
              raise SystemExit(f'missing expected Platform pin: {old}')
          s = s.replace(old, new)
          p.write_text(s)
          assert new in s
          assert old not in s
          PY
      - name: Commit preview pin update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-preview.yml
          git commit -m 'chore(preview): validate platform shell refinement'
          git push origin HEAD:main
