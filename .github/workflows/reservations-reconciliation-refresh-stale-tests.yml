name: Reservations reconciliation refresh stale tests

on:
  push:
    branches:
      - release/reservations-main-reconciliation

permissions:
  contents: write

jobs:
  refresh-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reservations-main-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh proven-stale Platform contracts from develop
        shell: bash
        run: |
          git fetch origin develop
          git checkout origin/develop -- \
            tests/platform-module-permission-administration-ui-round3g3.test.js \
            tests/platform-module-routing-reconciliation.test.js \
            tests/platform-release-consistency-guard-round3i1.test.js \
            tests/platform-shell-responsive-contract.test.js \
            tests/platform-unified-warehouse.test.js
      - name: Run full Platform suite with refreshed contracts
        run: npm run check
      - name: Commit refreshed contracts after PASS
        shell: bash
        run: |
          rm .github/workflows/reservations-reconciliation-refresh-stale-tests.yml
          rm -f .github/workflows/reservations-reconciliation-full-platform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/platform-module-permission-administration-ui-round3g3.test.js \
                  tests/platform-module-routing-reconciliation.test.js \
                  tests/platform-release-consistency-guard-round3i1.test.js \
                  tests/platform-shell-responsive-contract.test.js \
                  tests/platform-unified-warehouse.test.js \
                  .github/workflows/reservations-reconciliation-refresh-stale-tests.yml \
                  .github/workflows/reservations-reconciliation-full-platform.yml
          git commit -m "test(release): refresh reconciled platform contracts"
          git push origin HEAD:release/reservations-main-reconciliation
