name: Diagnose controlled Edge source drift
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'tools/release-preflight/diagnose-edge-source-drift.cjs'
      - '.github/workflows/diagnose-edge-source-drift.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate diagnostics script syntax
        run: node --check tools/release-preflight/diagnose-edge-source-drift.cjs
      - name: Report controlled Edge source drift
        run: node tools/release-preflight/diagnose-edge-source-drift.cjs
