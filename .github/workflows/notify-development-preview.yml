name: Notify Development Preview

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  notify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact develop commit to isolated preview
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::PREVIEW_DISPATCH_TOKEN is not configured; scheduled preview fallback remains active."
            exit 0
          fi
          gh api --method POST \
            repos/ramyawny37/conference-management-system-development-preview/dispatches \
            -f event_type=platform-develop-updated \
            -f client_payload[platform_sha]="$SOURCE_SHA"
