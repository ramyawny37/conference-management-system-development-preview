name: Reservations reconciliation full platform audit

on:
  push:
    branches:
      - release/reservations-main-reconciliation

permissions:
  contents: write

jobs:
  full-platform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/reservations-main-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full Platform suite
        run: npm run check
      - name: Remove one-time audit workflow after PASS
        shell: bash
        run: |
          rm .github/workflows/reservations-reconciliation-full-platform.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/reservations-reconciliation-full-platform.yml
          git commit -m "chore(release): remove completed full platform audit"
          git push origin HEAD:release/reservations-main-reconciliation
