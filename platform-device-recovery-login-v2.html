<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Stable Development device recovery</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:680px;margin:64px auto;padding:0 20px;color:#18202a}
    button{font:inherit;padding:12px 18px;border:0;border-radius:8px;background:#1769aa;color:#fff;cursor:pointer}
    input{font:inherit;width:min(100%,420px);padding:10px;box-sizing:border-box}
    button:disabled{opacity:.55;cursor:default} #status{margin-top:20px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>Stable Development device recovery</h1>
    <p>This one-time ceremony approves only the pre-authorized stable Development Platform device.</p>
    <form id="login" autocomplete="on">
      <p>Sign in with the existing Development owner account. This does not register or approve a device.</p>
      <label>Development owner email<br><input id="email" name="email" type="email" autocomplete="username" required></label><br><br>
      <label>Password<br><input id="password" name="password" type="password" autocomplete="current-password" required></label><br><br>
      <button id="sign-in" type="submit">Sign in to Development recovery</button>
    </form>
    <button id="recover" type="button" hidden>Verify owner passkey and approve stable device</button>
    <div id="status" role="status" aria-live="polite">Checking the registered-origin session…</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/storage/environment-namespace.js"></script>
  <script src="js/supabase/public-config.js"></script>
  <script src="js/supabase/runtime-config.js"></script>
  <script src="js/supabase/client.js"></script>
  <script src="js/supabase/auth.js?rev=recovery-login-v2"></script>
  <script src="js/supabase/device-identity.js?rev=recovery-login-v2"></script>
  <script src="js/platform-stable-device-recovery.js?rev=recovery-server-actor-v4"></script>
</body>
</html>
