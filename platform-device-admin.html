<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Platform device administration</title>
  <link rel="stylesheet" href="shared-design-tokens.css">
  <style>
    body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
    main{max-width:760px;margin:48px auto;padding:24px}
    section,article{background:#fff;border:1px solid #d9e0ea;border-radius:12px;padding:20px;margin-bottom:16px}
    button{border:0;border-radius:8px;padding:10px 16px;background:#1769aa;color:#fff;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:#607087}.error{color:#a51d2d}.success{color:#176b3a}
    code{direction:ltr;unicode-bidi:isolate}
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Platform device administration</h1>
      <p>This restricted surface requires an approved Platform account, role, and current device.</p>
      <p id="platform-device-admin-status" class="muted">Checking authorization…</p>
    </section>
    <div id="platform-device-admin-list"></div>
  </main>
  <script src="js/platform-device-admin.js"></script>
</body>
</html>
